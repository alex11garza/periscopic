[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "periscopic"
version = "0.1.1"
description = "Privacy-preserving SQL query transformation library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Alex Garza", email = "alexander.garza40@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alex11garza/periscopic"
Issues = "https://github.com/alex11garza/periscopic/issues"
