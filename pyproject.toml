[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PrivQ"
version = "1.1.2"
description = "Privacy-preserving SQL query transformation library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Alex Garza", email = "alexander.garza40@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
PrivQ = "PrivQ.__main__:main"

[project.urls]
Homepage = "https://github.com/alex11garza/PrivQ"
Issues = "https://github.com/alex11garza/PrivQ/issues"
